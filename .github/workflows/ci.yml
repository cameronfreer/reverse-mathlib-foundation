name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Builds the `RMFoundationBridge` rollup (strict — `warningAsError` is on),
      # including the pinned reverse-mathlib rebuilt under Foundation's toolchain.
      - uses: leanprover/lean-action@v1

      # The bridge audit: an axiom sweep over every declaration owned by an
      # `RMFoundationBridge` module (standard axioms only, no exemption mechanism),
      # plus per-headline dependency gates — each gated theorem and export record must
      # reach its named load-bearing dependencies, and no export leaf may reach the
      # derived ŴKL → Hall composition.
      - name: Bridge audit (axioms + dependency gates)
        run: lake env lean scripts/Audit.lean

      # The lean-interface-expr/1 conformance fixtures gate any encoder change.
      - name: Fingerprint conformance fixtures
        run: lake env lean scripts/FingerprintSpike.lean

      # Emitter determinism: re-emitting at the recorded export revision must
      # reproduce the committed evidence byte-for-byte.
      - name: Evidence emission determinism
        run: |
          if [ -f evidence/rmlib-bridge-evidence.json ]; then
            rev=$(jq -r .source.revision evidence/rmlib-bridge-evidence.json)
            BRIDGE_EXPORT_REVISION="$rev" lake env lean scripts/EmitEvidence.lean
            git diff --exit-code evidence/
          fi
